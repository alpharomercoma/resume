        NAME
        HIGHLIGHTS
      date_and_location_column: DATE
    experience_entry:
      main_column: |-
        **COMPANY**, **POSITION**
        HIGHLIGHTS
      date_and_location_column: DATE
    education_entry:
      main_column: |-
        **DEGREE in AREA, INSTITUTION**
        SUMMARY
      date_and_location_column: DATE

locale:
