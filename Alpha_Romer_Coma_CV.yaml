# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.8/schema.json
#
# Single source of truth for Alpha Romer Coma's resume.
# Edit this file, then run `./scripts/render.sh`.
# See AGENTS.md for the editing rules and the release flow; the look lives in alpha/.
cv:
  name: Alpha Romer Coma
  headline: On-Device Machine Learning Engineer
  # Rendered on its own line under the name. Visa status stays off the resume:
  # application forms ask for it, and their auto-reject rules read the form.
  location: Manila, Philippines · Open to relocation
  email: alpharomercoma@proton.me
  website: https://alpharomer.com/
  social_networks:
    - network: LinkedIn
      username: alpharomercoma
    - network: GitHub
      username: alpharomercoma
  sections:
    # Rendered centered under the contact line, with no heading.
    Summary:
      - Quantizing, compiling and benchmarking LLMs on phone NPUs, GPUs and CPUs, with fixes merged into ExecuTorch and TorchTPU.

    Professional Experience:
      - company: "[Experimental Machines](https://experimentalmachines.org/)"
        position: Open-Source Machine Learning Engineer
        start_date: 2026-08
        end_date: present
        highlights:
          - Shipped **[OpenWeights](https://github.com/ExperimentalMachines/openweights)** to Google Play; its on-device ExecuTorch LFM2.5 1.2B decodes **2.3× faster** than llama.cpp on Tensor G5.
          - Merged a fix into **[PyTorch ExecuTorch](https://github.com/pytorch/executorch/pull/23401)** that stops LFM2 models from carrying state into a new conversation.
          - Shipped **[ExecuServe](https://github.com/ExperimentalMachines/execuserve)**, an OpenAI-compatible Android LLM server; Qwen3-1.7B's first token took **0.41 s** on NPU vs. 2.0 s on CPU.
          - Built [KV cache prefix reuse](https://github.com/ExperimentalMachines/openweights/blob/main/docs/research/executorch.md) on Android; Qwen3-1.7B's second turn prefilled in **215 ms** by feeding 20 new tokens, not all 1,212.
          - Traced lost tool calls in int4 LFM2.5 builds to weight rounding; GPTQ raised needed searches **10% to 49%** in [held-out evals](https://github.com/ExperimentalMachines/experiments/tree/main/openweights/studies/on-device-evals).
          - Published **[236 ExecuTorch builds of 21 LLMs](https://huggingface.co/experimentalmachines)** for phone CPUs, GPUs, and NPUs.
          - Ran 8 LLMs in every CPU/GPU/NPU [prefill-decode pairing](https://experimentalmachines.org/experiments/prefill-decode/) on Snapdragon 8 Elite Gen 5; NPU prefill beat CPU by **10.5–15.9×**.
          - Traced [throttled-phone decode stalls](https://experimentalmachines.org/experiments/decode-stall/) (23.3 to **0.35 tok/s**) to spinning llama.cpp threads; a 2-thread C++ fallback held 10.7 tok/s.
      - company: "[ViableView](https://www.viableview.com/)"
        position: Senior Data Engineer
        start_date: 2026-02
        end_date: present
        highlights:
          - Built a filing-eligibility engine for **25 state registries**, with live-lookup latency of 2.7 s p50 and 9.2 s p95 in 20 states.
      - company: "[Kollab](https://www.kollab.com/)"
        position: Associate Cloud Engineer
        start_date: 2025-09
        end_date: 2026-02
        highlights:
          - Delivered a patient-search AI system for a hospital in **30 days** using Google Cloud, Vertex AI, and AlloyDB.

    Technical Skills:
      - label: Languages
        details: Python, C++, Kotlin (Android)
      - label: Training & Post-Training
        details: PyTorch, Hugging Face Transformers, PEFT/LoRA, TRL, DPO, GRPO, torch.compile
      - label: Inference & Optimization
        details: ExecuTorch, LiteRT-LM, llama.cpp/GGUF, int4/int8 PTQ (GPTQ, AWQ), KV caching, speculative decoding
      - label: On-Device Hardware
        details: Qualcomm Hexagon and MediaTek NPUs (QNN, NeuroPilot), Adreno/Mali GPUs (Vulkan), Arm CPUs (XNNPACK)
      - label: Datacenter Accelerators
        details: CUDA GPUs (H100, H200), ROCm (MI300X), AWS Trainium/Inferentia, Google TPU
      - label: Tooling
        details: Android (adb, Perfetto), Qualcomm Device Cloud, Firebase Test Lab, Git, Linux

    Projects & Research:
      - name: "**[On-Device Android Agent from LFM3-VL-2B](https://github.com/ExperimentalMachines/lfm3-mobile-agent)**"
        date: 2026-11
        highlights:
          - Fine-tuned LFM3-VL-2B into a screenshot-only phone agent at **15.5%** on held-out AndroidWorld, on par with GUI-Owl-1.5-2B (13.5%).
          - Deployed it on a phone GPU with LiteRT-LM at **2.5–3.6 s** per call; int8 matched the bf16 model's action on 90.6% of steps.
      - name: "**[4-Bit Weight and 8-Bit KV Cache Quantization on Phones](https://experimentalmachines.org/experiments/kv-cache/)**"
        date: 2026-11
        highlights:
          - 'Measured 8-bit vs. 32-bit ExecuTorch KV cache: **1.7–3.8×** faster 7.9k-token chats on phone CPUs, up to 5.3 GB less memory.'
          - Compared [AWQ with GPTQ](https://experimentalmachines.org/experiments/rtn-gptq-awq/) on 3 LLMs; AWQ was **25–62%** closer to full precision on long text but failed the publish gate on 2.
      - name: "**[Precision-Aware Compile Caching for Google TorchTPU](https://github.com/google-pytorch/torch_tpu/commit/1d8348cc07b6f29029f25fa95b13a72428324dc9)**"
        date: 2026-11
        highlights:
          - Found torch.compile on TPU silently reusing programs compiled at another matmul precision, from disk and in-memory caches.
          - Keyed the AOTAutograd cache and Dynamo guards on TPU precision, re-enabling Google's skipped test; merged upstream.
      - name: "**[LLM Fine-Tuning and Serving on AWS Trainium and Inferentia](https://github.com/alpharomercoma/torchneuronx)**"
        date: 2026-08
        highlights:
          - LoRA fine-tuned Llama 3.1 8B on Trainium1 at **68.3% MFU** (2,952 tok/s) and served the merged model with vLLM on Inferentia2.
          - Benchmarked ORPO preference tuning of the same model on Trainium1 at **30.2% MFU** and 1,181 tok/s throughput at 1,024 tokens.
          - Matched CPU predictions on all **10,000 ImageNet images** for compiled CLIP and SigLIP, and caught a CLIP graph returning NaN.
      - name: "**[Phone and Laptop AI Chip Benchmarks](https://experimentalmachines.org/experiments/)**"
        date: 2026-07
        highlights:
          - Measured Snapdragon 8 Elite's GPU at **479 GFLOP/s** on a 4096×4096 f32 matmul, 6.9× its own CPU.
          - Ran Gemma 3 1B on Apple M5 and Snapdragon X2 Elite; M5's GPU prefilled **2.9×** faster than X2's, but its CPU was 1.9× slower.
      - name: "**[Visual-Qwen: Multimodal Short-Form Video Classification](https://micromarc.vercel.app/thesis)**"
        date: 2025-12
        highlights:
          - Led a tri-modal EVA-CLIP/Whisper/Qwen3-4B VLM detecting “sludge” videos at **97.19% F1**, released with a 2,000-video dataset.

    # Titles are written as "**[Title](link)**, **Organization**" so an entry can
    # omit the organization.
    Speaking & Community:
      - name: "**International Conference Speaker**, **PyTorch Foundation & GitHub**"
        start_date: 2026-04
        end_date: 2026-12
        highlights:
          - 'Presenting “When the KV Cache Cannot Roll Back: Prefix Reuse on Android” at [PyTorch Day Japan](https://events.linuxfoundation.org/pytorch-day-japan/program/schedule/?id=1325509), Tokyo.'
          - Presented “When is local Copilot worth it?” at [GitHub Universe](https://reg.githubuniverse.com/flow/github/universe26/attendee-portal/page/sessioncatalog/session/1777208642747001yQNz), San Francisco.
          - 'Presented “De-mystifying PyTorch for ASICs” at [PyTorch Conference Europe](https://pytorchconferenceeu2026.sched.com/event/2HirM/de-mystifying-pytorch-for-asics-when-and-why-to-move-your-development-to-ai-accelerators-alpha-romer-coma-kollab-philippines?iframe=no), Paris.'
      - name: "**[PyTorch Ambassador](https://pytorch.org/programs/ambassadors/)**, **[GitHub Campus Expert](https://githubcampus.expert/fit-alpha-coma/)**, **AWS Community Builder**"
        start_date: 2024-12
        end_date: present
        highlights:
          - Gave 30+ talks on AI/ML, software engineering, and data engineering to 4,000+ students and professionals.

    Education:
      - institution: "[FEU Institute of Technology](https://www.feutech.edu.ph/)"
        area: Computer Science with specialization in Software Engineering
        degree: BS
        start_date: 2022-08
        end_date: 2026-09
        summary: President's Scholar with High Honors for all 4 years; Leadership Award (3 of 921 graduates)

    # Laid out in two columns, filled top to bottom.
    Certifications:
      - bullet: "[PyTorch Certified Associate (PTCA)](https://ti-user-certificates.s3.amazonaws.com/e0df7fbf-a057-42af-8a1f-590912be5460/31baf194-fb27-425d-9db8-58ca8a362c5c-alpha-romer-coma-7e12c937-7cfa-49bf-8096-1ce19196b9d1-certificate.pdf)"
      - bullet: "[Google Cloud Professional Machine Learning Engineer](https://www.credly.com/badges/4199288a-f45e-4584-87d3-a73397d2692c/)"

design:
  theme: alpha
  page:
    size: a4
  templates:
    single_date: MONTH_ABBREVIATION YEAR
    date_range: START_DATE – END_DATE
    one_line_entry:
      main_column: "**LABEL:** DETAILS"
    normal_entry:
      main_column: |-
        NAME
        HIGHLIGHTS
      date_and_location_column: DATE
    experience_entry:
      main_column: |-
        **COMPANY**, **POSITION**
        HIGHLIGHTS
      date_and_location_column: DATE
    education_entry:
      main_column: |-
        **DEGREE in AREA, INSTITUTION**
        SUMMARY
      date_and_location_column: DATE

locale:
  language: english
  present: Present
  month_abbreviations: [Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec]

settings:
  current_date: today
  pdf_title: NAME – Resume
  render_command:
    output_folder: rendercv_output
