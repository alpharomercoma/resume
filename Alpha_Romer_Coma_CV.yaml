cv:
  name: Alpha Romer Coma
  headline: Machine Learning Engineer
  email: alpharomercoma@proton.me
  website: https://alpharomer.com/
  social_networks:
    - network: LinkedIn
      username: alpharomercoma
    - network: GitHub
      username: alpharomercoma
  sections:
    # Rendered centered under the contact line, with no heading.
    Summary:
      - ML engineer in PyTorch spanning LLM pre-training and post-training, on-device inference, and GPU and AI accelerator benchmarking.

    Technical Skills:
      - label: Training & Post-Training
        details: PyTorch, Hugging Face Transformers, PEFT/LoRA, TRL, DPO, GRPO, scikit-learn
      - label: Inference & Optimization
        details: ExecuTorch, llama.cpp, vLLM, ONNX Runtime, MLX, quantization (GGUF, GPTQ)
      - label: Accelerators
        details: CUDA (H100, H200), ROCm (MI300X), AWS Trainium/Inferentia, Google TPU, mobile NPUs
      - label: Software & Cloud
        details: Python, Kotlin, TypeScript, SQL, Docker, Kubernetes, Terraform, AWS, Google Cloud

    Professional Experience:
      - company: "[Experimental Machines](https://experimentalmachines.org/)"
        position: Machine Learning Engineer
        start_date: 2026-08
        end_date: present
        highlights:
          - Shipped **OpenWeights**, an on-device LLM app on Google Play whose ExecuTorch builds decode **2.3× faster** than GGUF.
          - Published **16 ExecuTorch LLM exports** to Hugging Face for phone CPUs, GPUs, and Qualcomm and MediaTek NPUs.
          - Built **ExecuServe**, an OpenAI- and Anthropic-compatible server that runs ExecuTorch LLMs from an Android phone.
          - Merged a fix into **PyTorch ExecuTorch** that stops LFM2 models from carrying state into a new conversation.
          - Fixed RoPE tables in MediaTek's NPU export for Qwen and Llama, matching the Hugging Face reference over 301 tokens.
          - Secured a **$2,000 compute grant** from Lambda for the team's GPU training and benchmarking work.
      - company: "[ViableView](https://www.viableview.com/)"
        position: Senior Data Engineer
        start_date: 2026-02
        end_date: present
        highlights:
          - Designed an email-enrichment pipeline processing **2.6M records at 240K/day** and achieving **0.94 macro-F1** on validation.
          - Built ingestion for 2.7M registry records at 200K/day and an autoscaled multi-cloud pipeline validating 800K at 80K/day.
      - company: "[Kollab](https://www.kollab.com/)"
        position: Associate Cloud Engineer
        start_date: 2025-09
        end_date: 2026-02
        highlights:
          - Delivered a patient-search AI system for a leading Philippine hospital in **30 days** using Google Cloud, Vertex AI, and AlloyDB.

    Projects & Research:
      - name: "**[Small LLM Trained from Scratch to RLVR](https://huggingface.co/alpharomercoma/slm-pipeline-151m)**"
        date: 2026-08
        highlights:
          - Pre-trained a **151M-parameter LLM** (GQA, RoPE, SwiGLU) on **10B tokens** on one H100 in 20 hours for about $80.
          - Implemented SFT, DPO, and GRPO in plain PyTorch, raising GSM8K answer-format compliance from 5.5% to **98.5%**.
      - name: "**[LLM Fine-Tuning and Serving on AWS Trainium and Inferentia](https://github.com/alpharomercoma/torchneuronx)**"
        date: 2026-08
        highlights:
          - LoRA fine-tuned Llama 3.1 8B on Trainium at **68.3% MFU** (2,952 tok/s) and served the merged model with vLLM on Inferentia2.
          - Verified compiled models bit-exact against CPU on 10,000 ImageNet images and caught a CLIP graph silently returning NaN.
      - name: "**[MI300X vs. H200 GPU Benchmark](https://github.com/alpharomercoma/MI300X-vs-H200)**"
        date: 2026-07
        highlights:
          - Measured 164 vLLM serving points and 8B training; H200 trained **1.32–1.40× faster** despite MI300X's 1.32× FLOPs lead.
          - Showed MI300X winning 70B FP8 serving at 128–256 concurrency by up to **1.14×** and alone fitting 70B in BF16.
      - name: "**[Visual-Qwen: Multimodal Short-Form Video Classification](https://micromarc.vercel.app/thesis)**"
        date: 2025-12
        highlights:
          - Built a tri-modal EVA-CLIP/Whisper/Qwen3-4B VLM achieving 96.67% accuracy and 97.19% F1.
          - Published the model, code, and a **2,000-video multimodal dataset** spanning TikTok and YouTube Shorts.

    # Titles are written as "**[Title](link)**, **Organization**" so an entry can
    # omit the organization.
    Speaking & Community:
      - name: "**International Conference Speaker**, **PyTorch Foundation & GitHub**"
        start_date: 2026-04
        end_date: 2026-12
        highlights:
          - 'Presenting “When the KV Cache Cannot Roll Back: Prefix Reuse on Android” at [PyTorch Day Japan](https://events.linuxfoundation.org/pytorch-day-japan/program/schedule/?id=1325509), Tokyo.'
          - Presenting “When Is Local Copilot Worth It?” at [GitHub Universe](https://githubuniverse.com/), San Francisco.
          - 'Presented “De-mystifying PyTorch for ASICs” at [PyTorch Conference Europe](https://pytorchconferenceeu2026.sched.com/event/2HirM/de-mystifying-pytorch-for-asics-when-and-why-to-move-your-development-to-ai-accelerators-alpha-romer-coma-kollab-philippines?iframe=no), Paris.'
      - name: "**[PyTorch Ambassador](https://pytorch.org/programs/ambassadors/)**, **[GitHub Campus Expert](https://githubcampus.expert/fit-alpha-coma/)**, **AWS Community Builder**"
        start_date: 2024-12
        end_date: present
        highlights:
          - Selected as a 2026 PyTorch Foundation Ambassador to run events, create content, and mentor PyTorch users in the Philippines.
          - Trained 4,000+ students and professionals in AI/ML, software engineering, and data engineering across 25+ talks.
          - Secured $30,000+ in sponsorships from GitHub, Tavily, and Vercel to support technology education across Luzon.

    # Laid out in two columns, filled top to bottom.
    Certifications:
      - bullet: "[PyTorch Certified Associate (PTCA), Linux Foundation](https://ti-user-certificates.s3.amazonaws.com/e0df7fbf-a057-42af-8a1f-590912be5460/31baf194-fb27-425d-9db8-58ca8a362c5c-alpha-romer-coma-7e12c937-7cfa-49bf-8096-1ce19196b9d1-certificate.pdf)"
      - bullet: "[Google: Professional Machine Learning Engineer](https://www.credly.com/badges/4199288a-f45e-4584-87d3-a73397d2692c/)"
      - bullet: "[AWS Certified Machine Learning Engineer – Associate](https://www.credly.com/badges/89a55bb2-8f32-4938-84a1-683f21bb0e64)"
      - bullet: "[Google: Associate Cloud Engineer](https://www.credly.com/badges/197a51dd-409d-40b1-ba17-2b78bb1c30b1)"

    Education:
      - institution: "[FEU Institute of Technology](https://www.feutech.edu.ph/)"
        area: Computer Science with specialization in Software Engineering
        degree: BS
        start_date: 2022-08
        end_date: 2026-09
        summary: 4-Year President's Scholar with High Honors; Leadership Award (3 of 921 graduates); CS Academic Varsity

    Awards & Recognition:
      - name: "**[AWS re:Invent 2025 All Builders Welcome Grantee](https://reinvent.awsevents.com/all-builders-welcome/)**, **AWS**: sole Filipino among 340 international recipients"
        date: 2025-12
      - name: "**[PH100 Honoree](https://stellarph.io/programs/ph100/2025)**, **StellarPH**"
        date: 2025-09
      - name: "**[TESDA Academe Expert](https://www.linkedin.com/posts/alpharomercoma_its-an-honor-to-have-been-invited-by-activity-7369037611228688385-hcyV)**: validated two Philippine national AI and data competency qualifications"
        date: 2025-08
      - name: "**[National AI Prompt Design Challenge Champion](https://www.linkedin.com/posts/alpharomercoma_we-are-national-ai-prompt-champions-activity-7354141374771838976-KMUw)**, **Straits Interactive**"
        date: 2025-07

design:
  theme: alpha
  page:
    size: a4
  templates:
    single_date: MONTH_ABBREVIATION YEAR
    date_range: START_DATE – END_DATE
    one_line_entry:
