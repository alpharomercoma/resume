design:
  theme: alpha
  page:
    size: a4
  templates:
    single_date: MONTH_ABBREVIATION YEAR
    date_range: START_DATE – END_DATE
    one_line_entry:
      main_column: "**LABEL:** DETAILS"
    normal_entry:
      main_column: |-
        NAME
        HIGHLIGHTS
      date_and_location_column: DATE
    experience_entry:
      main_column: |-
        **COMPANY**, **POSITION**
        HIGHLIGHTS
      date_and_location_column: DATE
    education_entry:
      main_column: |-
        **DEGREE in AREA, INSTITUTION**
        SUMMARY
      date_and_location_column: DATE

locale:
  language: english
  present: Present
  month_abbreviations: [Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec]

settings:
  current_date: today
  pdf_title: NAME – Resume
  render_command:
    output_folder: rendercv_output
