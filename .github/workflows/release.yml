name: Render and release

# Every change to the CV on master becomes a dated release. alpharomer.com/resume
# serves the assets of the latest release, so publishing is just a push.
on:
  push:
    branches: [master]
    paths:
      - Alpha_Romer_Coma_CV.yaml
      - pyproject.toml
      - uv.lock
      - package.json
      - package-lock.json
      - scripts/**
      - ats/**
      - tests/**
      - alpha/**
      - .github/workflows/release.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # pdf.js is one of the ATS check's four text extractors.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pdf.js
        run: npm ci

      # Layout check, ATS check (results in the run summary) and the checker's own tests.
      - name: Render and check
        env:
          ATS_REQUIRE_PDFJS: "1"
        run: ./scripts/render.sh

      - uses: actions/upload-artifact@v4
        with:
          name: resume-${{ github.sha }}
          path: rendercv_output/

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="v$(date -u +%Y.%m.%d)"
          tag="$base"
          n=1
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do
            n=$((n + 1))
            tag="$base.$n"
          done

          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$prev" ]; then
            notes=$(git log --pretty='- %s (%h)' "$prev..HEAD" -- Alpha_Romer_Coma_CV.yaml alpha)
          else
            notes="- Initial RenderCV release."
          fi
          [ -n "$notes" ] || notes="- Rebuild with no content changes."

          cp Alpha_Romer_Coma_CV.yaml rendercv_output/
          cat > rendercv_output/version.json <<EOF
          {
            "version": "$tag",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "$GITHUB_SHA"
          }
          EOF

          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Resume $tag" \
            --notes "$notes" \
            --latest \
            rendercv_output/Alpha_Romer_Coma_CV.pdf \
            rendercv_output/Alpha_Romer_Coma_CV.png \
            rendercv_output/Alpha_Romer_Coma_CV.md \
            rendercv_output/Alpha_Romer_Coma_CV.html \
            rendercv_output/Alpha_Romer_Coma_CV.yaml \
            rendercv_output/version.json

      # alpharomer.com caches the latest release; expire it now instead of
      # waiting out the hourly refresh.
      - name: Refresh alpharomer.com/resume
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          SECRET: ${{ secrets.RESUME_REVALIDATE_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "RESUME_REVALIDATE_SECRET is not set; the site refreshes within the hour."
            exit 0
          fi
          curl -fsS --retry 3 --retry-all-errors -X POST \
            -H "Authorization: Bearer $SECRET" \
            https://alpharomer.com/api/revalidate/resume
